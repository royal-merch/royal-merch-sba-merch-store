<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ver tudo | Sir Betalot Loja Oficial</title>
  <meta name="description" content="A loja oficial Sir Betalot. Camisetas, moletons e bonés pesados em roxo real e dourado.">
  <meta name="theme-color" content="#1F0D2F">
  <link rel="icon" href="assets/img/brand/favicon.png">
  <link rel="preload" href="assets/fonts/YouBlockheadCaps.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/store.css">
</head>
<body data-page="shop">
  <main id="main">
    <div class="wrap">
      <div class="page-head">
        <nav class="crumbs" aria-label="Navegação estrutural" data-i18n-aria="crumb.label"><a href="index.html" data-i18n="crumb.home">Início</a><span aria-hidden="true">/</span><span id="crumb-here" aria-current="page">Ver tudo</span></nav>
        <h1 class="display" id="shop-title">Ver tudo</h1>
        <p id="shop-blurb">Todas as peças da coleção Sir Betalot.</p>
      </div>
      <div class="toolbar">
        <div class="chips" id="chips" role="group" aria-label="Filtrar por categoria" data-i18n-aria="shop.filter"></div>
        <div class="sort">
          <span class="count" id="count" aria-live="polite"></span>
          <label for="sort" data-i18n="shop.sortBy">Ordenar por</label>
          <select class="select" id="sort">
            <option value="featured" data-i18n="shop.featured">Destaques</option>
            <option value="new" data-i18n="shop.newest">Mais recentes</option>
            <option value="low" data-i18n="shop.low">Menor preço</option>
            <option value="high" data-i18n="shop.high">Maior preço</option>
          </select>
        </div>
      </div>
      <div class="grid cols-3" id="grid"></div>
    </div>
  </main>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/store.js"></script>
</body>
</html>
