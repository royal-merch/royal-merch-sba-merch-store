<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop all | Sir Betalot Official Store</title>
  <meta name="description" content="The official Sir Betalot store. Heavyweight tees, hoodies and snapbacks in royal purple and gold.">
  <meta name="theme-color" content="#1F0D2F">
  <link rel="icon" href="assets/img/brand/favicon.png">
  <link rel="preload" href="assets/fonts/YouBlockheadCaps.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/store.css">
</head>
<body data-page="shop">
  <main id="main">
    <div class="wrap">
      <div class="page-head">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><span id="crumb-here" aria-current="page">Shop all</span></nav>
        <h1 class="display" id="shop-title">Shop all</h1>
        <p id="shop-blurb">Every piece in the Sir Betalot collection.</p>
      </div>
      <div class="toolbar">
        <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
        <div class="sort">
          <span class="count" id="count" aria-live="polite"></span>
          <label for="sort">Sort by</label>
          <select class="select" id="sort">
            <option value="featured">Featured</option>
            <option value="new">Newest</option>
            <option value="low">Price, low to high</option>
            <option value="high">Price, high to low</option>
          </select>
        </div>
      </div>
      <div class="grid cols-3" id="grid"></div>
    </div>
  </main>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/store.js"></script>
</body>
</html>
